[project]
name = "ai-assistant"
version = "0.1.0"
description = "Personal voice AI assistant with custom voice cloning"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "duckduckgo-search>=8.1.1",
    "edge-tts>=7.2.8",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "miniaudio>=1.71",
    "numpy>=2.4.4",
    "openai>=2.35.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "sounddevice>=0.5.5",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["miniaudio", "sounddevice", "edge_tts", "faster_whisper", "ctranslate2", "pvporcupine", "duckduckgo_search"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
